<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail projektu | Stavební projekce s.r.o.</title>
    <meta name="description" content="Detail realizovaného projektu projekční kanceláře Stavební projekce s.r.o.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1><a href="index.html#uvod"><span>S</span>tavební <span>P</span>rojekce</a></h1>
            
            <input type="checkbox" id="menu-toggle" aria-label="Otevřít menu">
            <label for="menu-toggle" class="menu-btn">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <nav>
                <ul id="nav">
                    <li><a href="index.html#uvod">ÚVOD</a></li>
                    <li><a href="reference.html">REFERENCE</a></li>
                    <li><a href="index.html#o-spolecnosti">O SPOLEČNOSTI</a></li>
                    <li><a href="index.html#kontakt">KONTAKT</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="project-detail-page">
        <section class="detail-container">
            <a href="reference.html" class="back-btn">← Zpět na všechny reference</a>

            <div id="dynamic-content">
                <p id="project-category" class="category-label">Načítání kategorie...</p>
                <h1 id="project-title">Načítání projektu...</h1>
                <p id="project-description" class="description-text"></p>
                
                <div id="project-gallery" class="photo-gallery"></div>
            </div>
        </section>
    </main>

    <div id="lightbox" class="lightbox-modal">
        <span class="close-lightbox">&times;</span>
        <button class="lightbox-prev" aria-label="Předchozí obrázek">&#10094;</button>
        <button class="lightbox-next" aria-label="Následující obrázek">&#10095;</button>
        <img class="lightbox-content" id="lightbox-img" alt="Detail projektu v plné kvalitě">
    </div>

    <footer>
        <div class="footer-container">
            <img id="footer-logo" src="assets/logo/SP-logo.png" alt="Logo Stavební projekce s.r.o." loading="lazy">
            <p>&copy; 2026 Stavební projekce s.r.o. Všechna práva vyhrazena.</p>
        </div>
    </footer>

    <script src="js/projects.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const navLinks = document.querySelectorAll('#nav a');
            const menuToggle = document.getElementById('menu-toggle');
            navLinks.forEach(link => {
                link.addEventListener('click', () => {
                    if (menuToggle) menuToggle.checked = false;
                });
            });

            const header = document.querySelector('header');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });

            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('id');
            const contentContainer = document.getElementById('dynamic-content');

            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const closeBtn = document.querySelector('.close-lightbox');
            const prevBtn = document.querySelector('.lightbox-prev');
            const nextBtn = document.querySelector('.lightbox-next');

            let currentImageIndex = 0;
            let currentProjectImages = [];

            if (projectId && typeof projectsData !== 'undefined' && projectsData[projectId]) {
                const project = projectsData[projectId];
                currentProjectImages = project.images;

                document.getElementById('project-title').textContent = project.title;
                document.getElementById('project-category').textContent = project.category;
                
                const descEl = document.getElementById('project-description');
                if (project.description) {
                    descEl.textContent = project.description;
                } else {
                    descEl.style.display = 'none';
                }

                document.title = project.title + " | Stavební projekce s.r.o.";

                const gallery = document.getElementById('project-gallery');
                gallery.innerHTML = '';
                
                currentProjectImages.forEach((imageData, index) => {
                    const imgElement = document.createElement('img');
                    
                    imgElement.src = imageData.thumb;
                    imgElement.alt = project.title;
                    imgElement.loading = 'lazy';
                    
                    imgElement.addEventListener('click', () => {
                        currentImageIndex = index;
                        openLightbox();
                    });

                    gallery.appendChild(imgElement);
                });
            } else {
                contentContainer.innerHTML = '<h2>Tento projekt nebyl nalezen.</h2><p style="margin-top: 1rem;"><a href="reference.html" style="color: #c00202; text-decoration: underline;">Návrat na seznam referencí</a></p>';
            }

            function openLightbox() {
                lightboxImg.src = currentProjectImages[currentImageIndex].full;
                lightbox.style.display = "flex";
            }

            function showNextImage() {
                currentImageIndex = (currentImageIndex + 1) % currentProjectImages.length;
                openLightbox();
            }

            function showPrevImage() {
                currentImageIndex = (currentImageIndex - 1 + currentProjectImages.length) % currentProjectImages.length;
                openLightbox();
            }

            // Události pro šipky
            nextBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                showNextImage();
            });

            prevBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                showPrevImage();
            });

            closeBtn.addEventListener('click', () => {
                lightbox.style.display = "none";
            });

            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) {
                    lightbox.style.display = "none";
                }
            });
            
            document.addEventListener('keydown', (e) => {
                if (lightbox.style.display === "flex") {
                    if (e.key === "Escape") {
                        lightbox.style.display = "none";
                    } else if (e.key === "ArrowRight") {
                        showNextImage();
                    } else if (e.key === "ArrowLeft") {
                        showPrevImage();
                    }
                }
            });
        });
    </script>
</body>
</html>
